<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>한국AI콘텐츠연구소 - 이메일 문의 템플릿</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #333333;
      margin: 0;
      padding: 0;
      background-color: #f7fafc;
    }
    .wrapper {
      max-width: 600px;
      margin: 40px auto;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }
    .header {
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      color: #ffffff;
      padding: 30px;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .header p {
      margin: 5px 0 0 0;
      font-size: 13px;
      opacity: 0.8;
      font-family: monospace;
    }
    .content {
      padding: 40px 30px;
    }
    .field-group {
      margin-bottom: 25px;
      border-bottom: 1px solid #edf2f7;
      padding-bottom: 15px;
    }
    .field-group:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #4b5563;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .value {
      font-size: 15px;
      color: #1f2937;
      font-weight: 500;
    }
    .message-box {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 20px;
      font-size: 14px;
      color: #374151;
      white-space: pre-wrap;
      line-height: 1.7;
    }
    .footer {
      background-color: #f1f5f9;
      color: #64748b;
      padding: 20px;
      text-align: center;
      font-size: 12px;
    }
    .footer a {
      color: #3b82f6;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- 
    [EmailJS Dynamic Variable Matching Guide]
    To receive this form correctly in your email inbox, configure your EmailJS Template (template_szpuax5) 
    using the following parameter names matching the client payload:
    
    - {{name}} : 문의자 성함 (Sender Name)
    - {{email}} : 문의자 이메일 (Sender Email)
    - {{inquiryType}} : 문의 구분 (Inquiry Group/Category)
    - {{message}} : 상세 문의 내용 (Detailed Message Body)
  -->

  <div class="wrapper">
    <div class="header">
      <h1>한국AI콘텐츠연구소</h1>
      <p>KOREA AI CONTENTS LAB • NEW INQUIRY</p>
    </div>
    
    <div class="content">
      <div class="field-group">
        <div class="label">문의자 성함 (Name)</div>
        <div class="value">{{name}}</div>
      </div>
      
      <div class="field-group">
        <div class="label">이메일 주소 (Email)</div>
        <div class="value" style="font-family: monospace;"><a href="mailto:{{email}}">{{email}}</a></div>
      </div>
      
      <div class="field-group">
        <div class="label">문의 유형 (Inquiry Type)</div>
        <div class="value" style="display: inline-block; background-color: #eff6ff; color: #1e40af; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 600;">
          {{inquiryType}}
        </div>
      </div>
      
      <div class="field-group">
        <div class="label">상세 문의 내용 (Message)</div>
        <div class="message-box">{{message}}</div>
      </div>
    </div>
    
    <div class="footer">
      본 메일은 <a href="https://richardkim0888.netlify.app/">한국AI콘텐츠연구소 공식 웹사이트</a>의 문의 폼을 통해 자동 발송된 메시지입니다.<br>
      © 2026 Dr. Kim Kyung-tae. All rights reserved.
    </div>
  </div>

</body>
</html>
